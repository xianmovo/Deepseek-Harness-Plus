<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title data-i18n="error.title">DeepSeek Harness 启动失败</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--dsh-bg, #0f1115); color: var(--dsh-fg, #e6e6e6);
      font-family: var(--dsh-ui-font, system-ui, sans-serif); font-size: var(--dsh-font-size, 14px);
    }
    .wrap { max-width: 680px; padding: 32px; text-align: center; }
    h1 { font-size: 20px; margin: 0 0 12px; color: var(--dsh-danger, #ff8f8f); }
    pre {
      text-align: left; white-space: pre-wrap; word-break: break-word; max-height: 320px; overflow: auto;
      background: var(--dsh-bg-card, #161a22); border: 1px solid var(--dsh-border, #2a2f3a); border-radius: 8px;
      padding: 14px; font-size: 12px; color: var(--dsh-fg-soft, #c9d1dc);
      font-family: var(--dsh-mono-font, Consolas, monospace);
    }
    .actions { display: flex; gap: 12px; justify-content: center; margin-top: 18px; }
    button {
      padding: 10px 22px; border: 0; border-radius: 8px; cursor: pointer; font-size: 14px;
    }
    #logs { background: var(--dsh-bg-card, #161a22); color: var(--dsh-fg, #e6e6e6); border: 1px solid var(--dsh-border, #2a2f3a); }
    #quit { background: var(--dsh-accent, #4d7cfe); color: var(--dsh-accent-fg, #fff); }
    .meta { margin-top: 14px; font-size: 12px; color: var(--dsh-fg-dim, #6b7484); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 data-i18n="error.title">DeepSeek Harness 启动失败</h1>
    <pre id="message">未知错误。</pre>
    <div class="actions">
      <button id="logs" data-i18n="error.viewLogs">查看运行日志</button>
      <button id="quit" data-i18n="error.quit">退出</button>
    </div>
    <p class="meta" id="versions"></p>
  </div>
  <script>
    const params = new URLSearchParams(location.search)
    let T = {}
    function applyI18n(res) {
      if (!res) return
      T = res.messages || {}
      document.documentElement.lang = res.lang === 'en' ? 'en' : 'zh-CN'
      document.querySelectorAll('[data-i18n]').forEach(function (el) {
        var key = el.getAttribute('data-i18n')
        if (T[key]) el.textContent = T[key]
      })
      const explicit = params.get('message')
      document.getElementById('message').textContent = explicit || T['error.unknown'] || '未知错误。'
    }
    if (window.desktop) {
      const v = window.desktop.versions
      document.getElementById('versions').textContent = `Electron ${v.electron} / Chrome ${v.chrome} / Node ${v.node}`
      document.getElementById('quit').addEventListener('click', () => window.desktop.quit())
      document.getElementById('logs').addEventListener('click', () => window.desktop.openDebug ? window.desktop.openDebug() : window.desktop.quit())
      window.desktop.getI18n().then(applyI18n).catch(function () {})
      window.desktop.onAppearanceChanged(function (s) {
        if (s && s.lang) window.desktop.getI18n().then(applyI18n).catch(function () {})
      })
    }
  </script>
</body>
</html>
