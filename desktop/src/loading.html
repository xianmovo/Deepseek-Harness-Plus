<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title data-i18n="loading.title">正在启动 DeepSeek Harness</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--dsh-bg, #0f1115); color: var(--dsh-fg, #e6e6e6);
      font-family: var(--dsh-ui-font, system-ui, sans-serif); font-size: var(--dsh-font-size, 14px);
    }
    .wrap { text-align: center; }
    .spinner {
      width: 42px; height: 42px; margin: 0 auto 18px; border-radius: 50%;
      border: 4px solid var(--dsh-border, #2a2f3a); border-top-color: var(--dsh-accent, #4d7cfe);
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { margin: 6px 0; color: var(--dsh-fg-dim, #9aa4b2); }
    .hint { font-size: 12px; color: var(--dsh-fg-dim, #6b7484); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="spinner"></div>
    <div data-i18n="loading.main">正在启动 DeepSeek Harness 服务器&hellip;</div>
    <p data-i18n="loading.sub">正在准备 127.0.0.1 上的本地服务器。</p>
    <p class="hint" data-i18n="loading.hint">Deepseek正在偷吃你的Tokens...</p>
  </div>
  <script>
    (function () {
      function apply(messages, lang) {
        if (messages) {
          document.querySelectorAll('[data-i18n]').forEach(function (el) {
            var key = el.getAttribute('data-i18n')
            if (messages[key]) el.textContent = messages[key]
          })
        }
        if (lang) document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN'
      }
      window.desktop.getI18n().then(function (res) {
        apply(res && res.messages, res && res.lang)
      }).catch(function () {})
      window.desktop.onAppearanceChanged(function (s) {
        if (s && s.lang) {
          window.desktop.getI18n().then(function (res) {
            apply(res && res.messages, res && res.lang)
          }).catch(function () {})
        }
      })
    })()
  </script>
</body>
</html>
